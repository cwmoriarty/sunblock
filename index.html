<!DOCTYPE html>
<html>
<!-- Note: Non-production copy. Firebase hosts this file. --> 

  <body>
  
  <div class="centered">
  <h1>Sunblock Alpha ☀️</h1>
  <br><a href="" id="webcalURL">📅 <span id="city"></span> Weather Calendar</a><br>
  <br>

<input type="text" id="webCal" value="" ></input>
<input type="button" id="copy" value="Copy" onclick="copyCal()"></input>
</div>


<script type="text/javascript">
  function copyCal() {
    var webCal = document.getElementById("webCal");
    webCal.select();
    webCal.setSelectionRange(0, 99999); 
    navigator.clipboard.writeText(webCal.value);
    document.getElementById("copy").value="Copied.";
  }
</script>


  <script type="text/javascript">
    fetch('https://ipapi.co/json').then(response => response.json()).then(data => {
      city = data.city + ", " + data.region_code;
      document.getElementById("city").innerHTML = city;
      document.getElementById("webCal").value='https://sunblock.app/cal/?lat='+data.latitude.toFixed(2)+'&lon='+data.longitude.toFixed(2)+'&loc='+encodeURIComponent(city);
      document.getElementById("webcalURL").href='webcal://sunblock.app/cal/?lat='+data.latitude.toFixed(2)+'&lon='+data.longitude.toFixed(2)+'&loc='+encodeURIComponent(city);

    })
      .catch(error => {
        console.error("Error fetching IP data:", error);
      });
  </script>


  <style type="text/css">
    body { font-family: Helvetica, Geneva, sans-serif; }
    a { color: black; }
    .centered { 
      position: fixed;
      top: 50%;
      left: 50%;
      margin-top: -125px;
      margin-left: -87px;
    }
    </style>
</body>
</html>
