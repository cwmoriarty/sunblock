<!DOCTYPE html>
<html>

<head>
  <title>Sunblock 0.4b ☀️</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-914SDJ7S2Z"></script>
  <script>window.dataLayer = window.dataLayer || []; function gtag() { dataLayer.push(arguments); } gtag('js', new Date()); gtag('config', 'G-914SDJ7S2Z');</script>
</head>

<body>

  <div class="centered">
    <h1>Sunblock 0.4b ☀️</h1>
    <br>📅 <a href="" id="webcalURL"><span id="city" contenteditable="plaintext-only" spellcheck="false" title="Click to edit city name"></span></a> Weather Calendar.<br>
    <br>

    <input type="text" id="webCal" value=""></input>
    <input type="button" id="copy" value="Copy" onclick="copyCal()"></input>
    <br>
    <span id="gcal"></span>
  </div>

  <div class="libleft">
    👨‍💻 <a href="http://cwmoriarty.com">cwmoriarty.com</a><br><br>
  </div>

  <script type="text/javascript">
    function copyCal() {
      var webCal = document.getElementById("webCal");
      webCal.select();
      webCal.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(webCal.value);
      document.getElementById("copy").value = "Copied.";
      document.getElementById("gcal").innerHTML = "<a href=https://calendar.google.com/calendar/u/0/r/settings/addbyurl>Paste in Google Calendar</a>";
    }
  </script>

  <script type="text/javascript">
    const usStates = {
      "Alabama": "AL", "Alaska": "AK", "Arizona": "AZ", "Arkansas": "AR", "California": "CA",
      "Colorado": "CO", "Connecticut": "CT", "Delaware": "DE", "Florida": "FL", "Georgia": "GA",
      "Hawaii": "HI", "Idaho": "ID", "Illinois": "IL", "Indiana": "IN", "Iowa": "IA",
      "Kansas": "KS", "Kentucky": "KY", "Louisiana": "LA", "Maine": "ME", "Maryland": "MD",
      "Massachusetts": "MA", "Michigan": "MI", "Minnesota": "MN", "Mississippi": "MS", "Missouri": "MO",
      "Montana": "MT", "Nebraska": "NE", "Nevada": "NV", "New Hampshire": "NH", "New Jersey": "NJ",
      "New Mexico": "NM", "New York": "NY", "North Carolina": "NC", "North Dakota": "ND", "Ohio": "OH",
      "Oklahoma": "OK", "Oregon": "OR", "Pennsylvania": "PA", "Rhode Island": "RI", "South Carolina": "SC",
      "South Dakota": "SD", "Tennessee": "TN", "Texas": "TX", "Utah": "UT", "Vermont": "VT",
      "Virginia": "VA", "Washington": "WA", "West Virginia": "WV", "Wisconsin": "WI", "Wyoming": "WY",
      "District of Columbia": "DC"
    };

    let currentLat = 0;
    let currentLon = 0;
    let currentCountry = "US";
    const citySpan = document.getElementById("city");

    function updateCalendarLinks(cityName) {
      let url = 'sunblock.app/cal/?lat=' + currentLat.toFixed(2) + '&lon=' + currentLon.toFixed(2) + '&loc=' + encodeURIComponent(cityName || '');
      if (currentCountry !== "US" && currentCountry !== "us") {
        url += '&units=C';
      }
      document.getElementById("webCal").value = 'https://' + url;
      document.getElementById("webcalURL").href = 'webcal://' + url;
    }

    function setCityAndLinks(name, lat, lon, country) {
      currentLat = typeof lat === 'number' ? lat : parseFloat(lat) || 0;
      currentLon = typeof lon === 'number' ? lon : parseFloat(lon) || 0;
      currentCountry = country || "US";
      citySpan.textContent = name;
      updateCalendarLinks(name);
    }

    function fallbackToBrowserGeolocation() {
      if (!("geolocation" in navigator)) {
        setCityAndLinks("Your Location", 0, 0, "US");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            if (!res.ok) throw new Error("Nominatim request failed: " + res.status);
            const geoData = await res.json();
            const addr = geoData.address || {};

            const detectedCity = addr.city || addr.town || addr.village || addr.municipality || addr.hamlet || addr.suburb || addr.county || "Your Location";
            const stateAbbr = (addr["ISO3166-2-lvl4"] ? addr["ISO3166-2-lvl4"].split("-")[1] : "") || usStates[addr.state] || addr.state_code || addr.state || "";
            const country = addr.country_code ? addr.country_code.toUpperCase() : (addr.country === "United States" ? "US" : "");

            const fullCity = stateAbbr ? `${detectedCity}, ${stateAbbr}` : detectedCity;
            setCityAndLinks(fullCity, lat, lon, country);
          } catch (err) {
            console.error("Nominatim reverse geocoding error:", err);
            setCityAndLinks("Your Location", lat, lon, "US");
          }
        },
        (geoErr) => {
          console.error("Browser geolocation error or permission denied:", geoErr);
          setCityAndLinks("Your Location", 0, 0, "US");
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    }

    // Editable city interactions
    citySpan.addEventListener("click", (e) => {
      e.stopPropagation();
    });

    citySpan.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        citySpan.blur();
      }
    });

    citySpan.addEventListener("input", () => {
      updateCalendarLinks(citySpan.textContent.trim());
    });

    // Determine initial city & coordinates via IP
    fetch('https://ipapi.co/json')
      .then(response => {
        if (!response.ok) throw new Error("ipapi fetch failed");
        return response.json();
      })
      .then(data => {
        if (data.error || !data.city || typeof data.latitude !== 'number' || typeof data.longitude !== 'number') {
          throw new Error(data.reason || "City not found in IP data");
        }
        const city = data.city + (data.region_code ? ", " + data.region_code : "");
        setCityAndLinks(city, data.latitude, data.longitude, data.country_code || data.country || "US");
      })
      .catch(error => {
        console.warn("ipapi.co lookup failed, falling back to browser geolocation:", error);
        fallbackToBrowserGeolocation();
      });
  </script>

  <style type="text/css">
    body {
      font-family: Helvetica, Geneva, sans-serif;
    }

    a {
      color: black;
    }

    .centered {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50%;
      height: 50%;
      font-size: calc(1vw + 1vh);
    }

    .centered h1 {
      font-size: calc(2vw + 2vh);
    }

    #city {
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: inherit;
      outline: none;
      cursor: text;
      border-bottom: 1px dashed rgba(0, 0, 0, 0.4);
      padding: 0 2px;
    }

    #city:focus {
      background-color: rgba(0, 0, 0, 0.05);
      border-bottom-style: solid;
    }

    @media (max-width: 768px) {
      .centered {
        width: 50%;
        height: 50%;
        font-size: calc(2vw + 2vh);
      }
    }

    .libleft {
      font-size: large;
      position: fixed;
      left: 10px;
      bottom: 10px;
    }
  </style>
</body>

</html>
